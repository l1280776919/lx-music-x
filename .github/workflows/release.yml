name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LX Music X ${{ github.ref_name }}'
          releaseBody: |
            ## LX Music X ${{ github.ref_name }}
            
            基于 Tauri 2.0 重构的新一代高颜值跨平台音乐查找播放助手。
            
            ### ✨ 核心特性
            - ⚡ **超轻量秒开**：常驻内存低至 40MB，体积小巧
            - 🎵 **多源聚合检索**：覆盖网易云、酷狗、QQ、酷我、咪咕及自定义源
            - 💻 **本地音乐扫描**：原生 Rust 极速遍历本地目录与无损解码
            - 🎛️ **专业 10-Band EQ**：硬件级 Web Audio 均衡器与音效预设
            - 🪟 **原生桌面悬浮歌词**：独立透明置顶窗口与鼠标穿透
            - 📦 **旧版数据无损升级**：自动向下兼容原版 SQLite 数据库
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
